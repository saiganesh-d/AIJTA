[project]
name = "ai-forge"
version = "0.2.0"
description = "AI Forge: Jira support-ticket triage and fixing with GitHub Copilot CLI, Teams approvals and a token-saving code index"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "keyring>=25",
  "jsonschema>=4.21",
  "mcp>=1.2",
  "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.3"]

[project.scripts]
forge = "forge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forge*"]

[tool.setuptools.package-data]
forge = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
