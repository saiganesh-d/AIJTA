name: ai-forge tests
on:
  push:
    paths: ["ai-forge/**", ".github/workflows/ai-forge-tests.yml"]
  pull_request:
    paths: ["ai-forge/**", ".github/workflows/ai-forge-tests.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-forge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest pyflakes
      - run: python -m pyflakes forge tests
      - run: python -m pytest -q
